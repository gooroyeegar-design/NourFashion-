plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gooroyeegar.pianostudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gooroyeegar.pianostudio'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
}
